syntax = "proto3";

package moksha.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/alper/moksha/internal/api/gen/moksha/v1;mokshav1";

// LogService keeps what user code printed and logged while its steps ran:
// workers append it, people read it (the web UI, `moksha dev`). Logs are
// not state; they don't go through the event log.
service LogService {
  // AppendLogs adds lines to a step attempt's log. An attempt keeps at most
  // 1 MiB; after that its log says it was cut.
  rpc AppendLogs(AppendLogsRequest) returns (AppendLogsResponse);
  // GetLogs returns a run's log lines (of one step, with seq), oldest
  // first, steps interleaved by time.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  // stdout, stderr or log (a logging record).
  string stream = 2;
  // Log records: INFO, WARNING, ERROR, ...
  string level = 3;
  // Log records: the logger's name.
  string logger = 4;
  string text = 5;
}

message AppendLogsRequest {
  string attempt_id = 1;
  repeated LogLine lines = 2;
}
message AppendLogsResponse {}

message GetLogsRequest {
  string run_id = 1;
  // Only this step's lines; 0: all of the run's.
  int32 seq = 2;
  // The last this many lines; default 2000, at most 10000.
  int32 limit = 3;
}
message GetLogsResponse {
  repeated RunLogLine lines = 1;
  // Older lines left out by limit.
  int32 skipped = 2;
}

// RunLogLine is a log line with the step and attempt it came from.
message RunLogLine {
  int32 seq = 1;
  string step = 2;
  int32 attempt = 3;
  LogLine line = 4;
}
