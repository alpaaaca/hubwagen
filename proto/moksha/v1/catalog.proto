syntax = "proto3";

package moksha.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alper/moksha/internal/api/gen/moksha/v1;mokshav1";

// CatalogService reads the catalog: datasets, their partitions and data versions,
// and what each data version was built from and into. It is a projection of the
// event logs; the one write is marking bad data invalid.
service CatalogService {
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
  // ListPartitions returns a dataset's partitions with a committed data version,
  // each with its newest one, in partition order.
  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse);
  // ListDataVersions returns data versions newest first.
  rpc ListDataVersions(ListDataVersionsRequest) returns (ListDataVersionsResponse);
  // GetDataVersion returns a data version, its manifest if it can be read, and its
  // lineage: everything it was built from (upstream) and everything built
  // from it (downstream), transitively.
  rpc GetDataVersion(GetDataVersionRequest) returns (GetDataVersionResponse);
  // InvalidateDataVersion marks a data version and everything built from it,
  // transitively, invalid: never reused, never a dataset's latest. It
  // returns what it marked (or, dry_run, would mark) and the runs that
  // built those data versions, whose replay recomputes them.
  rpc InvalidateDataVersion(InvalidateDataVersionRequest) returns (InvalidateDataVersionResponse);
  // ListStale returns the partitions whose latest data version is out of date:
  // an input's partition has a newer data version with other content, or the
  // newest build has another code version of the step that built it.
  rpc ListStale(ListStaleRequest) returns (ListStaleResponse);
  // ExpireDataVersions expires now what retention no longer keeps (the leader
  // also does on a timer): the data versions are recorded as expired, then their
  // data is deleted; manifests and lineage stay.
  rpc ExpireDataVersions(ExpireDataVersionsRequest) returns (ExpireDataVersionsResponse);
}

message ExpireDataVersionsRequest {
  bool dry_run = 1;
}

message ExpiredDataVersion {
  DataVersion data_version = 1;
  string reason = 2;
}

message ExpireDataVersionsResponse {
  repeated ExpiredDataVersion expired = 1;
}

message ListStaleRequest {
  // Default: "default".
  string tenant = 1;
  // Empty: every dataset.
  string dataset = 2;
}

message StaleDataVersion {
  // The partition's latest data version.
  DataVersion data_version = 1;
  string step = 2;
  repeated string reasons = 3;
  // The run that built it: starting it again with its params refreshes it.
  RunRef run = 4;
}

message ListStaleResponse {
  repeated StaleDataVersion stale = 1;
}

message InvalidateDataVersionRequest {
  string id = 1;
  // Required; recorded with every data version marked.
  string reason = 2;
  // Who asked, for the record.
  string by = 3;
  bool dry_run = 4;
}

// RunRef is a run that built an invalidated data version: replaying it with the
// same params recomputes what was invalidated.
message RunRef {
  string id = 1;
  string name = 2;
  string params_json = 3;
  string tenant = 4;
}

message InvalidateDataVersionResponse {
  // The data version itself first.
  repeated DataVersion data_versions = 1;
  repeated RunRef runs = 2;
}

message Dataset {
  string tenant = 1;
  string name = 2;
  // Empty: unpartitioned.
  string partition_key = 3;
  google.protobuf.Timestamp created_at = 4;
  // Retention, if any: per partition the latest stays, and those among the
  // newest keep_versions or younger than keep_for.
  int32 keep_versions = 5;
  google.protobuf.Duration keep_for = 6;
}

message DataVersion {
  string id = 1;
  string tenant = 2;
  string dataset = 3;
  string partition = 4;
  // The manifest's URI.
  string location = 5;
  string content_hash = 6;
  string fingerprint = 7;
  string stats_json = 8;
  string meta_json = 9;
  // Who built it: a run and its step command.
  string run_id = 10;
  int32 step_seq = 11;
  // pending, committed, invalid or expired.
  string state = 12;
  // Why it is invalid or expired.
  string reason = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp committed_at = 15;
  google.protobuf.Timestamp retired_at = 16;
}

message ListDatasetsRequest {
  // Empty: every tenant.
  string tenant = 1;
}

message ListDatasetsResponse {
  repeated Dataset datasets = 1;
}

message ListPartitionsRequest {
  // Default: "default".
  string tenant = 1;
  string dataset = 2;
  // Only partitions after this one (paging).
  string after = 3;
  // Default 100, at most 1000.
  int32 limit = 4;
}

message Partition {
  string partition = 1;
  DataVersion latest = 2;
  // Committed data versions of the partition.
  int32 data_versions = 3;
}

message ListPartitionsResponse {
  repeated Partition partitions = 1;
}

message ListDataVersionsRequest {
  // Default: "default".
  string tenant = 1;
  string dataset = 2;
  // Only this partition, when set.
  optional string partition = 3;
  // Empty: any.
  repeated string states = 4;
  // Only data versions older than this one (paging).
  string before_id = 5;
  // Default 50, at most 1000.
  int32 limit = 6;
}

message ListDataVersionsResponse {
  repeated DataVersion data_versions = 1;
}

message GetDataVersionRequest {
  string id = 1;
}

message ManifestFile {
  string path = 1;
  int64 size = 2;
  string sha256 = 3;
}

message Manifest {
  // The prefix its files are under.
  string data = 1;
  repeated ManifestFile files = 2;
  // What the step returned, if not null.
  string result_json = 3;
}

// LineageEdge: data_version_id was built from input_id, passed as name.
message LineageEdge {
  string data_version_id = 1;
  string input_id = 2;
  string name = 3;
}

message Lineage {
  // Including the data version itself.
  repeated DataVersion data_versions = 1;
  repeated LineageEdge edges = 2;
}

message GetDataVersionResponse {
  DataVersion data_version = 1;
  // The step that built it.
  string step = 2;
  // Unset when it can't be read (expired, or the bucket isn't reachable).
  Manifest manifest = 3;
  string manifest_error = 4;
  Lineage upstream = 5;
  Lineage downstream = 6;
}
