syntax = "proto3";

package hubwagen.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alper/hubwagen/internal/api/gen/hubwagen/v1;hubwagenv1";

// HaulService is what people and tools call: start hauls and follow them.
// Like WorkerService it is a Connect service, callable as plain HTTP/JSON.
service HaulService {
  // StartHaul starts a haul and queues its first replay. A haul no
  // registered build defines fails with FAILED_PRECONDITION.
  rpc StartHaul(StartHaulRequest) returns (StartHaulResponse);
  // GetHaul returns a haul and its lifts.
  rpc GetHaul(GetHaulRequest) returns (GetHaulResponse);
  // SignalHaul sends a signal to an open haul. A signal the haul isn't
  // waiting for yet is kept until it waits; each goes to one wait. NOT_FOUND
  // for an unknown haul, FAILED_PRECONDITION for a finished one.
  rpc SignalHaul(SignalHaulRequest) returns (SignalHaulResponse);
  // CancelHaul cancels an open haul: its queued work is withdrawn, the
  // children it waits for are cancelled. A finished haul is left as is.
  rpc CancelHaul(CancelHaulRequest) returns (CancelHaulResponse);
  // ResumeHaul gives a stuck haul a new replay, typically after a fix was
  // deployed. A haul that isn't stuck is left as is.
  rpc ResumeHaul(ResumeHaulRequest) returns (ResumeHaulResponse);
  // ListHauls returns hauls newest first (without their lifts).
  rpc ListHauls(ListHaulsRequest) returns (ListHaulsResponse);
  // GetLogbook returns the events a replay of the haul reads, for replaying
  // it against other code (hubwagen.testing --replay).
  rpc GetLogbook(GetLogbookRequest) returns (GetLogbookResponse);
  // GetHistory tells what happened in a haul, in plain words: one entry per
  // event, in order.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  // ListSchedules returns the current haul schedules and their next runs,
  // and the dataset subscriptions.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  // ListPipelines returns the hauls the registered builds define, with the
  // title and description of the newest build that defines each.
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  // ListWorkers returns the workers that polled lately (the leader's
  // memory, not state: a new leader learns them from their next polls).
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
}

message ListWorkersRequest {}
message ListWorkersResponse {
  repeated Worker workers = 1;
}
message Worker {
  string id = 1;
  // Empty if it polls without one.
  string build_id = 2;
  repeated string docks = 3;
  // haul, lift.
  repeated string kinds = 4;
  // Its last poll or heartbeat.
  google.protobuf.Timestamp last_seen = 5;
  // Waiting for work right now; otherwise busy.
  bool polling = 6;
}

message ListPipelinesRequest {}
message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
}
message Pipeline {
  // The haul's name in code.
  string name = 1;
  // Empty if its code gives none.
  string title = 2;
  string description = 3;
}

message ListHaulsRequest {
  // Empty: any.
  string tenant = 1;
  string name = 2;
  repeated string statuses = 3;
  // Default 50, at most 1000.
  int32 limit = 4;
  // Only the children of this haul (started by its start_haul commands).
  string parent_id = 5;
  // Only hauls older than this one (paging).
  string before_id = 6;
  // Also return each haul's lifts (name, status, reused, times; no results
  // or edges): a run history by step. At most 200 hauls then.
  bool with_lifts = 7;
}

message CancelHaulRequest {
  string haul_id = 1;
  // Who asked, for the record.
  string by = 2;
}

message CancelHaulResponse {}

message ResumeHaulRequest {
  string haul_id = 1;
}

message ResumeHaulResponse {}

message ListHaulsResponse {
  repeated Haul hauls = 1;
}

message GetLogbookRequest {
  string haul_id = 1;
}

message GetLogbookResponse {
  Haul haul = 1;
  // As PollHaulTask sends them.
  repeated LogbookEvent logbook = 2;
}

message LogbookEvent {
  int64 seq = 1;
  string type = 2;
  google.protobuf.Timestamp time = 3;
  string payload_json = 4;
}

message GetHistoryRequest {
  string haul_id = 1;
}

message GetHistoryResponse {
  repeated HistoryEntry entries = 1;
}

// HistoryEntry is one event of a haul, told for people (internal/history).
message HistoryEntry {
  google.protobuf.Timestamp time = 1;
  // started, finished, stuck, step, reused, problem, retry, wait, run,
  // data; engine for the engine's own bookkeeping.
  string kind = 2;
  // The lift it is about, 0 and "" for the haul itself.
  int32 seq = 3;
  string step = 4;
  // The sentence, without the step's name.
  string text = 5;
  // More, when there is: an error message, arguments.
  string detail = 6;
  // A haul it refers to: the one a lift was reused from, a child.
  string haul_id = 7;
  // The event it tells.
  int64 event_seq = 8;
  string event_type = 9;
  string payload_json = 10;
}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
  repeated Subscription subscriptions = 2;
}

message Subscription {
  string haul = 1;
  repeated string datasets = 2;
  google.protobuf.Duration debounce = 3;
  google.protobuf.Duration max_wait = 4;
  int32 max_batch = 5;
  string build_id = 6;
  // Pallets waiting for the haul to start.
  int32 waiting = 7;
}

message Schedule {
  string haul = 1;
  string cron = 2;
  string timezone = 3;
  string interval = 4;
  string catch_up = 5;
  // The build whose code declared it.
  string build_id = 6;
  // Everything before this is handled (cron interval: the last tick).
  google.protobuf.Timestamp cursor = 7;
  // The next tick.
  google.protobuf.Timestamp next_run = 8;
  // The inputs of a run for the latest interval that came due (JSON):
  // {"interval": {"$interval": {start, end}}}, to start one by hand.
  string latest_params_json = 9;
}

message SignalHaulRequest {
  string haul_id = 1;
  // What the haul waits for: ctx.wait_signal(name).
  string name = 2;
  // JSON; empty means null.
  string payload_json = 3;
}

message SignalHaulResponse {
  string signal_id = 1;
}

message StartHaulRequest {
  string tenant = 1;
  // The registered haul function.
  string name = 2;
  // Default: "default".
  string dock = 3;
  // A JSON object.
  string params_json = 4;
  // Default: "manual".
  string trigger = 5;
}

message StartHaulResponse {
  string haul_id = 1;
}

message GetHaulRequest {
  string haul_id = 1;
}

message GetHaulResponse {
  Haul haul = 1;
}

message Haul {
  string id = 1;
  string tenant = 2;
  string name = 3;
  // running, stuck, completed, failed, cancelled or continued
  // (continue_as_new: continued_as carries on).
  string status = 4;
  string reason = 5;
  string message = 6;
  string params_json = 7;
  string result_json = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  repeated Lift lifts = 11;
  // A child haul: the haul that started it.
  string parent_id = 12;
  // Status continued: the haul that carries on.
  string continued_as = 13;
  // What started it: "schedule", "subscription", "haul <id>" (a child),
  // "continue <id>", or what the caller of StartHaul said.
  string trigger = 14;
  // How many of its lifts are where, so far.
  LiftCounts lift_counts = 15;
  // A running haul with work queued that no worker took yet: why
  // (GetHaul and ListHauls, from the leader's memory).
  Waiting waiting = 16;
}

// Waiting is a haul's queued work and why no worker runs it yet.
message Waiting {
  // no_worker: no worker polls the dock; no_build: workers poll it, but
  // none has code that defines the haul or lift; busy: those that do are
  // all busy; dock_limit: the dock runs as many lifts as it may.
  string reason = 1;
  // The same, in plain words, with what to do about it.
  string message = 2;
  // haul: the haul's own replay waits; lift: one of its lifts.
  string kind = 3;
  // The haul or lift function, and the lift's seq.
  string name = 4;
  int32 seq = 5;
  string dock = 6;
  // When it was queued.
  google.protobuf.Timestamp since = 7;
  // The workers that poll the dock for it, and their builds.
  int32 workers = 8;
  repeated string builds = 9;
}

message LiftCounts {
  int32 total = 1;
  int32 completed = 2;
  // Of the completed: memoized, nothing ran.
  int32 reused = 3;
  int32 failed = 4;
  int32 cancelled = 5;
}

message Lift {
  int32 seq = 1;
  string name = 2;
  // scheduled, waiting, dispatched, retry_wait, committing, completed,
  // failed or cancelled.
  string status = 3;
  // Why it ran ("code changed (v1 → v2)", "not memoized", ...); empty if it
  // was reused.
  string run_reason = 4;
  // Memoized: an earlier pallet stood in, nothing ran.
  bool reused = 5;
  int32 attempts = 6;
  // The pallet it produced or reused, if any.
  string pallet = 7;
  // Why it failed or was cancelled.
  string reason = 8;
  string message = 9;
  // When the haul asked for it, and when it finished.
  google.protobuf.Timestamp scheduled_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  string result_json = 12;
  // The lifts of this haul (by seq) whose pallets it reads: the haul's DAG.
  repeated int32 after = 13;
  // The dataset its pallet goes to, if it has an output.
  string dataset = 14;
  // Why it ran or was reused, in plain words ("its code changed (v1 →
  // v2)"); empty when there is nothing to say.
  string why = 15;
}
