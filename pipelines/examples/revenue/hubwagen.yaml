# One server and three worker processes, for hubwagen dev (and hubwagen
# server, the same with logs only, as a service):
#   ./hubwagen dev --config pipelines/examples/revenue/hubwagen.yaml
# Relative paths are relative to this file.
apiVersion: hubwagen.dev/v1alpha1
kind: Config

data_dir: .hubwagen
server:
  listen: 127.0.0.1:7070

workers:
  - name: py
    replicas: 3
    command: [python3, -m, hubwagen.worker, --lifts, "2"]   # modules: pyproject.toml
    env:
      PYTHONPATH: ../../../sdk/python/src   # an installed SDK needs none
