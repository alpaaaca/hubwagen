# The revenue example as a project (docs/projects.md): what `moksha deploy`
# reads. (moksha.yaml next to it is still the config moksha dev reads.)
#   moksha deploy --dry-run --local     # its code in place (PYTHONPATH to the SDK)
#   MOKSHA_WORKER_IMAGE=moksha-worker:dev moksha deploy --dry-run   # in its image
apiVersion: moksha.dev/v1alpha1
kind: Project
name: revenue

build:
  dockerfile: Dockerfile
  image: ${REVENUE_IMAGE:-ghcr.io/alpaaaca/revenue}
  args:
    WORKER_IMAGE: ${MOKSHA_WORKER_IMAGE:-ghcr.io/alpaaaca/moksha-worker:latest}

pools:
  - name: default
    min: 0
    max: 3
    steps: 2
