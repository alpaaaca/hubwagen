# One server and three worker processes, for moksha dev (and moksha
# server, the same with logs only, as a service):
#   ./moksha dev --config pipelines/examples/revenue/moksha.yaml
# Relative paths are relative to this file.
apiVersion: moksha.dev/v1alpha1
kind: Config

data_dir: .moksha
server:
  listen: 127.0.0.1:7070

workers:
  - name: py
    replicas: 3
    command: [python3, -m, moksha.worker, --steps, "2"]   # modules: pyproject.toml
    env:
      PYTHONPATH: ../../../sdk/python/src   # an installed SDK needs none
