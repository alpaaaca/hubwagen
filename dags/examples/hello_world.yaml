name: hello_world
description: "Three-step sequential demo"

steps:
  - id: step_a
    name: "Step A"
    executor: shell
    command: "echo 'Hello from A' && sleep 1"

  - id: step_b
    name: "Step B"
    executor: shell
    depends_on: [step_a]
    command: "echo 'Hello from B' && sleep 1"

  - id: step_c
    name: "Step C"
    executor: shell
    depends_on: [step_b]
    command: "echo 'Hello from C'"
