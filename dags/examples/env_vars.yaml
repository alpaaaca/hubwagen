name: env_vars
description: "Shows DAG-level env vars inherited by all steps, overridden per step"

env:
  ENVIRONMENT: staging
  WAREHOUSE: bigquery
  BATCH_DATE: "2024-01-15"

steps:
  - id: show_globals
    name: "Show global env"
    executor: shell
    command: |
      echo "ENVIRONMENT=$ENVIRONMENT"
      echo "WAREHOUSE=$WAREHOUSE"
      echo "BATCH_DATE=$BATCH_DATE"

  - id: override_env
    name: "Step with overridden env"
    executor: shell
    depends_on: [show_globals]
    env:
      ENVIRONMENT: production
      EXTRA: "step-local-value"
    command: |
      echo "ENVIRONMENT=$ENVIRONMENT"
      echo "WAREHOUSE=$WAREHOUSE"
      echo "EXTRA=$EXTRA"

  - id: timeout_step
    name: "Step with timeout"
    executor: shell
    depends_on: [show_globals]
    timeout_sec: 5
    command: "echo 'Finished well within 5s timeout'"
