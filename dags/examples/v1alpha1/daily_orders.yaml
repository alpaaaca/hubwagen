apiVersion: hubwagen.dev/v1alpha1
kind: Pipeline
metadata:
  name: daily_orders
  tenant: examples
  description: "Load and model yesterday's orders: agent task → container job → notification"
  labels: {team: analytics}
spec:
  schedule:
    cron: "0 2 * * *"
    timezone: Europe/Berlin
    interval: daily
    catchup: true
    start: 2026-10-01
  params:
    full_refresh: {type: bool, default: false}
  concurrency:
    max_active_runs: 1
    on_overlap: queue
  defaults:
    retry: {limit: 2, backoff: exponential, initial: 30s, max: 10m}
    timeout: 30m
    runtime: {kind: agent, pool: local}
  tasks:
    - id: extract
      command: ["/bin/sh", "-c"]
      args:
        - 'echo "extracting {{ .Interval.Start }} → {{ .Interval.End }}" && echo "id,amount" > "$HUBWAGEN_OUTPUT_ORDERS_RAW/orders.csv"'
      env: {LOG_LEVEL: info}
      outputs:
        - name: orders_raw
          asset: raw.orders
          partition: '{{ .Interval.Start | date "2006-01-02" }}'

    - id: transform
      depends_on: [extract]
      runtime:
        kind: job
        image: docker.io/library/alpine:3.20
        resources: {cpu: "500m", memory: 256Mi}
      command: ["/bin/sh", "-c"]
      args:
        - 'wc -l "$HUBWAGEN_INPUT_ORDERS/orders.csv" && test "{{ .Params.full_refresh }}" = "false"'
      inputs:
        - name: orders
          from: extract.orders_raw
      timeout: 2h

    - id: notify
      depends_on: [transform]
      trigger_rule: all_done
      command: ["/bin/sh", "-c"]
      args: ['echo "daily_orders for {{ .Interval.Start | date "2006-01-02" }} finished"']
