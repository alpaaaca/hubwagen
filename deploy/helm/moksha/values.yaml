# The server: one replica (a single leader on SQLite), its data on a PVC.
image:
  repository: ghcr.io/alpaaaca/moksha
  tag: ""                 # default: the chart's appVersion
  pullPolicy: IfNotPresent

server:
  port: 7070
  logLevel: info
  resources: {}
  persistence:
    size: 5Gi
    storageClass: ""      # default: the cluster's
  # Where data versions go: an S3 bucket (recommended), else the PVC.
  bucket:
    url: ""               # s3://bucket[/prefix]
    endpoint: ""          # S3-compatible stores (MinIO, R2); empty for AWS
    region: ""
    # A Secret with keys access_key_id and secret_access_key; empty: the
    # pod's role (IRSA, Workload Identity) or the AWS defaults.
    existingSecret: ""
  serviceAccount:
    annotations: {}       # e.g. eks.amazonaws.com/role-arn for the bucket

service:
  type: ClusterIP         # the API has no authentication yet: keep it inside the cluster

# Deployed projects (moksha deploy --push): the server runs each pool of a
# project's current version as a Deployment in this namespace,
# <instance>-<project>-<pool>-v<version>, and sets its replicas between the
# pool's min and max from the work waiting. A new version is a new
# Deployment; the old one is deleted and its pods finish what they run.
projects:
  instance: ""            # moksha.dev/instance on those Deployments; default: the release's full name
  imagePullSecrets: []    # Secrets for pulling projects' images, e.g. [ghcr]
  # A project's {secret: name} is the key "value" of the Secret called name
  # in this namespace: kubectl create secret generic revenue-db --from-literal=value=…

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
