apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
data:
  moksha.yaml: |
    apiVersion: moksha.dev/v1alpha1
    kind: Config
    data_dir: /data
    server:
      listen: 0.0.0.0:{{ .Values.server.port }}
    {{- with .Values.server.bucket }}
    {{- if .url }}
    bucket:
      url: {{ .url | quote }}
      {{- with .endpoint }}
      endpoint: {{ . | quote }}
      {{- end }}
      {{- with .region }}
      region: {{ . | quote }}
      {{- end }}
      {{- if .existingSecret }}
      access_key_id_file: /etc/moksha/bucket/access_key_id
      secret_access_key_file: /etc/moksha/bucket/secret_access_key
      {{- end }}
    {{- end }}
    {{- end }}
    kubernetes:
      namespace: {{ .Release.Namespace }}
      instance: {{ include "moksha.instance" . }}
      {{- with .Values.projects.imagePullSecrets }}
      image_pull_secrets: {{ toJson . }}
      {{- end }}
    projects:
      launcher: kubernetes
      server_url: {{ include "moksha.serverURL" . }}
