{{- if .Values.pools }}
# The server sets these Deployments' replicas (launcher: kubernetes): it may
# patch their scale subresource, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "moksha.fullname" . }}-scaler
  labels: {{- include "moksha.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
    resourceNames:
      {{- range .Values.pools }}
      - {{ include "moksha.poolName" (dict "root" $ "pool" .) }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "moksha.fullname" . }}-scaler
  labels: {{- include "moksha.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "moksha.fullname" . }}-scaler
subjects:
  - kind: ServiceAccount
    name: {{ include "moksha.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.pools }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moksha.poolName" (dict "root" $ "pool" .) }}
  labels: {{- include "moksha.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    moksha.dev/pool: {{ .name }}
spec:
  # The server sets the replicas (min to max). A new Deployment starts at
  # min, not Kubernetes' 1; an upgrade keeps what the server last set.
  {{- $live := lookup "apps/v1" "Deployment" $.Release.Namespace (include "moksha.poolName" (dict "root" $ "pool" .)) }}
  replicas: {{ if $live }}{{ $live.spec.replicas }}{{ else }}{{ .min | default 0 }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      moksha.dev/pool: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: worker
        moksha.dev/pool: {{ .name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .terminationGracePeriodSeconds | default 600 }}
      containers:
        - name: worker
          image: {{ required (printf "pools[%s].image is required" .name) .image | quote }}
          {{- with .command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - {name: MOKSHA_SERVER, value: {{ include "moksha.serverURL" $ | quote }}}
            - {name: MOKSHA_QUEUES, value: {{ join "," (.queues | default (list "default")) | quote }}}
            - {name: MOKSHA_STEPS, value: {{ .steps | default 4 | quote }}}
            - {name: MOKSHA_DATA, value: remote}
            {{- range $k, $v := .env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          {{- with .resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
