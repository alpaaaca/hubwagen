apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
  {{- with .Values.server.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
# The server runs deployed projects as Deployments in this namespace
# (projects.launcher: kubernetes): it creates, lists and deletes them, and
# sets their replicas. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "moksha.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "moksha.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "moksha.fullname" . }}-data
  labels: {{- include "moksha.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.server.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1                # one leader: SQLite, one writer
  strategy:
    type: Recreate           # never two on the same data
  selector:
    matchLabels: {{- include "moksha.serverSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moksha.serverSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "moksha.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server, --config, /etc/moksha/moksha.yaml, --log-format, json, --log-level, {{ .Values.server.logLevel | quote }}]
          ports:
            - name: api
              containerPort: {{ .Values.server.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: api}
          livenessProbe:
            httpGet: {path: /healthz, port: api}
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/moksha/moksha.yaml, subPath: moksha.yaml}
            {{- if .Values.server.bucket.existingSecret }}
            - {name: bucket, mountPath: /etc/moksha/bucket, readOnly: true}
            {{- end }}
          {{- with .Values.server.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "moksha.fullname" . }}-data
        - name: config
          configMap:
            name: {{ include "moksha.fullname" . }}
        {{- with .Values.server.bucket.existingSecret }}
        - name: bucket
          secret:
            secretName: {{ . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moksha.fullname" . }}
  labels: {{- include "moksha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "moksha.serverSelector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.server.port }}
      targetPort: api
